<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>贷款案件管理</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: gradient hero with the key number, a floating shortcut card, soft tinted tiles, card lists; fixed bottom tab bar with a raised AI-scan button */
:root{
  --bg:#f2f5fc; --surface:#ffffff; --fg:#141b33; --muted:#66708c; --line:#e2e7f3;
  --tile:#e9effd; --tile-2:#f0ebfe;
  --accent:#2f56e8; --accent-soft:#e4ebfd; --accent-fg:#ffffff;
  --hero-a:#1f3fe0; --hero-b:#5b3ce6; --hero-c:#8a43e8; --hero-fg:#ffffff;
  --ok:#14955a; --ok-soft:#e1f5ea; --warn:#c06a00; --warn-soft:#fff1dc; --bad:#d23a2f; --bad-soft:#fde6e4; --info:#2f56e8; --info-soft:#e4ebfd;
  --ic-orange:#ff8a1f; --ic-orange-bg:#fff1e3; --ic-peach:#ff6a3d; --ic-peach-bg:#ffece5; --ic-violet:#6b4cf5; --ic-violet-bg:#efebff; --ic-blue:#1e88f5; --ic-blue-bg:#e3f1ff;
  --f-body:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Plus Jakarta Sans",system-ui,sans-serif;
  --r:18px; --r-sm:12px;
  --shadow:0 10px 30px -12px rgba(31,45,110,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1122; --surface:#171c33; --fg:#e8ebf7; --muted:#9aa3c2; --line:#272e4d; --tile:#1c2443; --tile-2:#221d43;
  --accent:#7d97ff; --accent-soft:#1f2a52; --accent-fg:#0d1122; --hero-a:#1a2ea8; --hero-b:#3b2aa8; --hero-c:#5d2fb0;
  --ok:#4fd08f; --ok-soft:#14301f; --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#ff7d72; --bad-soft:#3d1a18; --info:#7d97ff; --info-soft:#1f2a52;
  --ic-orange-bg:#3a2612; --ic-peach-bg:#3a1e16; --ic-violet-bg:#261f4d; --ic-blue-bg:#132a45; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1122; --surface:#171c33; --fg:#e8ebf7; --muted:#9aa3c2; --line:#272e4d; --tile:#1c2443; --tile-2:#221d43;
  --accent:#7d97ff; --accent-soft:#1f2a52; --accent-fg:#0d1122; --hero-a:#1a2ea8; --hero-b:#3b2aa8; --hero-c:#5d2fb0;
  --ok:#4fd08f; --ok-soft:#14301f; --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#ff7d72; --bad-soft:#3d1a18; --info:#7d97ff; --info-soft:#1f2a52;
  --ic-orange-bg:#3a2612; --ic-peach-bg:#3a1e16; --ic-violet-bg:#261f4d; --ic-blue-bg:#132a45; --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero-a)}
.inner{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* hero */
.hero{margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:64px;color:var(--hero-fg);
  background:linear-gradient(125deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-12%;top:-30%;width:70%;height:160%;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,0));transform:skewX(-18deg);pointer-events:none}
.hero.compact{padding-bottom:22px}
.hero .inner{position:relative;z-index:1}
.htop{display:flex;align-items:center;gap:10px}
.brandpill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:14px;white-space:nowrap}
.brandpill .logo{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center}
.searchpill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:0 14px;height:40px}
.searchpill svg{flex:none}
.searchpill input{border:0;background:transparent;padding:0;height:100%;color:#141b33;font:inherit;font-size:14px;width:100%;outline:none}
.searchpill input::placeholder{color:#7c86a3}
.langpill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;height:40px;min-width:48px;padding:0 12px;font-weight:700;font:inherit;font-weight:700;cursor:pointer}
.hkey{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.hkey .lbl{font-size:14px;opacity:.9;display:flex;align-items:center;gap:6px}
.hkey .num{font-family:var(--f-num);font-weight:800;font-size:clamp(30px,8vw,40px);letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums}
.hkey .meta{font-size:13px;opacity:.85;margin-top:2px}
.outline-pill{border:1.5px solid rgba(255,255,255,.85);color:#fff;background:transparent;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.htitle{font-size:22px;font-weight:800;margin:18px 0 0;text-wrap:balance}
.hsub{font-size:13px;opacity:.85;margin:4px 0 0}
.mode{font-size:11px;opacity:.85;margin-top:10px}
/* quick card */
.quick{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-top:-46px;position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);padding:16px 6px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--fg);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px;text-align:center}
.qicon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.qicon svg{width:30px;height:30px}
.q1{background:var(--ic-orange-bg);color:var(--ic-orange)}.q2{background:var(--ic-peach-bg);color:var(--ic-peach)}.q3{background:var(--ic-violet-bg);color:var(--ic-violet)}.q4{background:var(--ic-blue-bg);color:var(--ic-blue)}
main{padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:6px 0 22px}
.tile{background:var(--tile);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;border:0;color:var(--fg);font:inherit;text-align:left;cursor:pointer;min-width:0}
.tile.alt{background:var(--tile-2)}
.tile .ti{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--accent)}
.tile b{display:block;font-size:15px}
.tile small{color:var(--muted);font-size:12px}
.tile .chip{display:inline-block;background:var(--surface);color:var(--accent);border-radius:8px;padding:2px 10px;font-weight:800;font-family:var(--f-num);margin-top:4px}
.ringcard{background:var(--surface);border-radius:var(--r-sm);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.ringcard .v{font-family:var(--f-num);font-weight:800;font-size:18px;white-space:nowrap}
.sec{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.sec h2{font-size:18px;margin:0;font-weight:800}
.sec .lnk{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:24px}
.sbtn{background:var(--surface);border:1.5px solid transparent;border-radius:var(--r-sm);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;color:var(--fg)}
.sbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sbtn .n{font-family:var(--f-num);font-weight:800;font-size:22px;line-height:1}
.sbtn .l{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:1px}
/* case cards */
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{background:var(--surface);border:0;border-radius:var(--r);padding:14px 16px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 var(--line);min-width:0}
.ccard:hover{box-shadow:var(--shadow)}
.ccard .top{display:flex;align-items:center;gap:8px;min-width:0}
.ccard .who{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ccard .ty{color:var(--muted);font-size:13px}
.ccard .bot{display:flex;align-items:center;gap:10px}
.ccard .amt{font-family:var(--f-num);font-weight:800;font-size:17px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .bar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 0 4px}
.tabbar button{background:none;border:0;font:inherit;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;cursor:pointer}
.tabbar button svg{width:24px;height:24px;display:block}
.tabbar button span{line-height:1.2}
.tabbar button[aria-current="true"]{color:var(--fg)}
.tabbar .scan{position:relative;margin-top:-26px;padding:0 0 10px}
.tabbar .scan .ring{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 -4px 14px -6px rgba(31,45,110,.25)}
.tabbar .scan .core{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,#3d8bff,var(--hero-b) 60%,var(--hero-c));display:grid;place-items:center;color:#fff}
.tabbar .scan .core svg{width:28px;height:28px}
.tabbar .scan span.t{margin-top:2px}
/* generic */
h1{font-size:20px;margin:6px 0 4px;text-wrap:balance}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
button,.btn{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:9px 18px;font-weight:700}
.btn.ghost{background:var(--accent-soft);color:var(--accent);border:0}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:0 1px 0 var(--line)}
.tablebox{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:0 1px 0 var(--line)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
tbody tr:last-child td{border-bottom:0}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:700}
.s-new{background:var(--info-soft);color:var(--info)}
.s-collect{background:var(--warn-soft);color:var(--warn)}
.s-review{background:var(--ic-violet-bg);color:var(--ic-violet)}
.s-approved,.s-disbursed{background:var(--ok-soft);color:var(--ok)}
.s-rejected{background:var(--bad-soft);color:var(--bad)}
.d-new{background:var(--info)}.d-collect{background:var(--warn)}.d-review{background:var(--ic-violet)}.d-approved,.d-disbursed{background:var(--ok)}.d-rejected{background:var(--bad)}
.bar{height:8px;background:var(--tile);border-radius:4px;overflow:hidden;min-width:60px;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hero-a),var(--hero-c));border-radius:4px}
.bar.full i{background:var(--ok)}
.pct{display:flex;align-items:center;gap:8px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.tag.sample{color:var(--warn);border-color:var(--warn)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto;border-radius:999px;padding:7px 12px;background:var(--surface)}
.case{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.case{grid-template-columns:1fr}}
.group{margin-bottom:16px}
.group h3{font-size:12px;color:var(--muted);letter-spacing:.04em;margin:0 0 6px;font-weight:700}
.item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 4px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.item .zh{font-weight:600}
.item.done .zh{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.item .en{font-size:12px;color:var(--muted)}
.item .note{font-size:12px;color:var(--fg);margin-top:4px}
.item .meta{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.req{font-size:11px;color:var(--bad);margin-left:6px;font-weight:700}
.opt{font-size:11px;color:var(--muted);margin-left:6px}
.linkish{background:none;border:0;color:var(--accent);padding:0;font-size:12px;font-weight:700}
.pipeline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.pipeline button{border:0;background:var(--tile);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.pipeline button[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:12px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.log{font-size:12px;color:var(--muted);max-height:220px;overflow:auto;margin:0;padding-left:16px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ref ul{margin:0;padding-left:18px}
.ref li{margin:3px 0}
.notice{font-size:13px;color:var(--fg);background:var(--warn-soft);border-radius:var(--r-sm);padding:10px 12px;margin:10px 0 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13px;z-index:30}
.backbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.drop{display:inline-block;cursor:pointer}
.up{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding:12px 0}
.up.settled{opacity:.75}
.up.busy .thumb{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.thumb{width:96px;height:120px;border-radius:12px;background:var(--tile);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.issues{background:var(--warn-soft);color:var(--fg);border-radius:var(--r-sm);padding:8px 12px;margin:8px 0;font-size:13px}
.issues.ok{background:var(--ok-soft)}
.issues ul{margin:4px 0 0;padding-left:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.h3{font-size:12px;color:var(--muted);margin:8px 0 6px;font-weight:700}
.privacy{font-size:11px;color:var(--muted);margin:12px 0 0}
a.linkish{text-decoration:none}
.ai{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(125deg,var(--hero-a),var(--hero-c)) border-box;border:1.5px solid transparent}
@media (max-width:480px){.up{grid-template-columns:64px minmax(0,1fr)}.thumb{width:64px;height:84px}.qicon{width:50px;height:50px}.qbtn{font-size:12px}.brandpill .bt{display:none}.brandpill{padding:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="hero"></div>
<main class="inner" id="app"><div class="empty">载入中…</div></main>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- 文件清单模板 (一般马来西亚市场做法，需按合作银行/自家审批标准调整) ----------
const DOC = {

  co_dir_ic:["所有董事及股东身份证","IC of all directors & shareholders"],
  co_audit:["最近 2-3 年审计报告","Latest 2-3 years audited accounts"],
  co_mgmt:["最新管理账 (Management Accounts)","Latest management accounts"],

  co_cprof:["公司简介、主要客户合约或发票","Company profile, key contracts / invoices"],
  co_premise:["营业场所租约或产权证明","Premises tenancy / title"],
  co_guar:["董事个人担保文件","Directors' personal guarantee"],
  ent_partner:["合伙协议 (如是合伙)","Partnership agreement (if any)"],
  ent_owner_ic:["东主 / 所有合伙人身份证","IC of owner / all partners"],
  h_booking:["订房表格 + 订金收据","Booking form + deposit receipt"],

function buildItems(type,profile,subtype){
  const t=T[type], p=t.profiles[profile], out=[];
  p.groups.forEach(([g,list])=>list.forEach(([k,r])=>out.push({key:k,group:g,req:!!r})));
  if(t.subtypes&&subtype) t.subtypes[subtype].docs.forEach(([k,r])=>out.push({key:k,group:t.subGroup||"房产文件",req:!!r}));

}

async function put(col,obj){
  if(S.db){await S.db.collection(col).doc(obj.id).set(strip(obj));}
  else{const arr=S[col];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);lsSave();render();}
}
async function del(col,id){
  if(S.db){await S.db.collection(col).doc(id).delete();}
  else{S[col]=S[col].filter(x=>x.id!==id);lsSave();render();}
}
function strip(o){const c={...o};delete c.id;return c}

async function boot(){
  let db=null;
  try{db=await (window.claude?.use?window.claude.use("db"):null)}catch(e){db=null}
  const mode=document.getElementById("mode");
  if(db){
    S.db=db;S.mode="db";
    let got=0;const timer=setTimeout(()=>{if(!S.ready){S.ready=true;render();}},10000);
    ["clients","cases"].forEach(col=>db.collection(col).onSnapshot(snap=>{
      S[col]=snap.docs.map(x=>({id:x.id,...x.data()}));
      if(++got>=2||S.ready){clearTimeout(timer);S.ready=true}
      render();
    },err=>{toast(L("读取失败：")+err.message)}));
  }else{
    S.mode="local";
    const saved=lsLoad();
    const data=saved||localSample();S.clients=data.clients;S.cases=data.cases;S.ready=true;render();
  }
}

// ---------- 事件 ----------
function touch(c,msg){c.updatedAt=new Date().toISOString();c.log=(c.log||[]).concat(msg?[{at:c.updatedAt,t:msg}]:[]).slice(-60)}
function curCase(){return S.cases.find(x=>x.id===V.caseId)}
async function saveCase(c,msg){touch(c,msg);try{await put("cases",c)}catch(e){toast(L("保存失败：")+(e.message||e.code))}}

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button,tr[data-case]");if(!b)return;
  if(b.id==="langBtn"){LANG=LANG==="en"?"zh":"en";try{localStorage.setItem("loanapp.lang",LANG)}catch(e){}render();return}
  if(b.id==="scanBtn"||b.hasAttribute("data-scan")){if(V.view==="case"&&$("#aiFile")){$("#aiFile").click();return}go("scan");return}
  if(b.hasAttribute("data-clear")){V.filterStatus="";V.filterType="";render();return}
  if(b.dataset.go){go(b.dataset.go,{confirmDel:false});return}
  if(b.dataset.case){const fromScan=V.view==="scan";go("case",{caseId:b.dataset.case,confirmDel:false});if(fromScan)$("#aiFile")?.click();return}
  if(b.dataset.fs!==undefined){V.filterStatus=b.dataset.fs;render();return}
  if(b.dataset.editClient){go("clients",{editingClient:b.dataset.editClient});return}
  if(b.hasAttribute("data-cancel-edit")){go("clients",{editingClient:null});return}
  if(b.dataset.openCaseFor){go("newcase",{newcaseClient:b.dataset.openCaseFor});syncNewCaseForm();return}
  const c=curCase();if(!c)return;
  if(b.dataset.status){if(c.status!==b.dataset.status){const from=SLABEL[c.status];c.status=b.dataset.status;await saveCase(c,`状态：${from} → ${SLABEL[c.status]}`);toast(L("状态已更新"))}return}
  if(b.dataset.note!==undefined){const it=c.items[+b.dataset.note];const box=document.createElement("form");box.className="row";box.style.marginTop="6px";box.innerHTML=`<input id="note_in" value="${esc(it.note)}" placeholder="${L("例如：只交了 2 个月，还欠 1 个月")}" style="flex:1;min-width:160px"><button class="btn ghost" type="submit">保存</button>`;b.closest(".item").children[1].appendChild(box);b.remove();box.querySelector("input").focus();
    box.onsubmit=async e=>{e.preventDefault();it.note=box.querySelector("input").value.trim();await saveCase(c,`备注「${it.zh}」`);render()};return}
  if(b.dataset.rmitem!==undefined){const it=c.items.splice(+b.dataset.rmitem,1)[0];await saveCase(c,`删除文件项「${it.zh}」`);return}
  if(b.id==="saveNotes"){c.notes=$("#c_notes").value;await saveCase(c,"更新案件备注");toast(L("备注已保存"));return}
  if(b.id==="copyMissing"){const cl=client(c.clientId)||{};const miss=c.items.filter(i=>i.req&&!i.done);const txt=LANG==="en"?`Hi ${cl.name||""}, for your ${T[c.type].en} application (${c.no}) we still need the following documents:\n`+miss.map((i,n)=>`${n+1}. ${docMain(i)}`).join("\n")+"\nThank you!":`${cl.name||""} 你好，你的${T[c.type].label}申请 (${c.no}) 还需要以下文件：\n`+miss.map((i,n)=>`${n+1}. ${i.zh}`).join("\n")+"\n谢谢！";
    try{await navigator.clipboard.writeText(txt);toast(L("已复制，可以贴到 WhatsApp"))}catch(e){const ta=document.createElement("textarea");ta.value=txt;b.after(ta);ta.select();toast(L("请手动复制下面的文字"))}return}
  if(b.id==="delCase"){if(!V.confirmDel){V.confirmDel=true;render();return}V.confirmDel=false;await del("cases",c.id);go("dash");toast(L("案件已删除"));return}
});
document.addEventListener("change",async ev=>{

function directSample(key){
  const toB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(b)});
  const json=async(prompt,opt={})=>{
    const imgs=[].concat(opt.images||[]);const content=[];
    for(const b of imgs)content.push({type:"image",source:{type:"base64",media_type:b.type||"image/jpeg",data:await toB64(b)}});
    content.push({type:"text",text:prompt});
    let res;try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-opus-5-5",max_tokens:2000,messages:[{role:"user",content}]})})}catch(e){throw {code:"upstream_error",message:String(e)}}
    if(!res.ok){throw {code:res.status===401||res.status===403?"bad_key":res.status===429||res.status===529?"rate_limited":"upstream_error",message:"HTTP "+res.status}}
    const data=await res.json();const text=(data.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
    const a=text.indexOf("{"),z=text.lastIndexOf("}");if(a<0||z<a)throw {code:"invalid_json",text};
    try{return JSON.parse(text.slice(a,z+1))}catch(e){throw {code:"invalid_json",text}}
  };
  return {json,limits:async()=>({images:{maxCount:5,maxInputBytes:1e7,mediaTypes:["image/jpeg","image/png","image/webp"]}})};
}

async function shrink(file){

    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",0.85));}catch(e){return file}
}

      const cc=S.cases.find(x=>x.id===c.id);cc.uploads=(cc.uploads||[]).concat(rec);

    }catch(e){
      delete AI.busy[bid];
      const code=e?.code;
      if(code==="bad_key"){toast(L("API Key 不对或没有权限，请重新输入。"));try{localStorage.removeItem("loanapp.apikey")}catch(_){}AI.sample=null;AI.imgOK=false;render();return}
      if(code==="not_granted"){AI.off=L("你没有允许这个页面使用 Claude，所以 AI 识别关掉了。");render();return}
      toast(code==="rate_limited"||code==="queue_overflow"?L("AI 太忙，等一下再试。"):code==="invalid_json"||code==="image_rejected"||code==="refused"?L("AI 没能读懂这张图，请重拍清楚一点。"):L("AI 识别失败：")+(code||e?.message||""));
      render();

document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="aiFile"){const fs=[...t.files];t.value="";aiFiles(fs);return}
  if(t.dataset.umatch){const [,u]=upFind(t.dataset.umatch);if(u){u.match=+t.value;render()}}
});
document.addEventListener("submit",ev=>{if(ev.target.id!=="keyForm")return;ev.preventDefault();const k=$("#apiKey").value.trim();if(!k)return;try{localStorage.setItem("loanapp.apikey",k)}catch(e){}AI.sample=directSample(k);AI.imgOK=true;render();toast(L("API Key 已保存在这台设备"))});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.ufield){const [id,k]=t.dataset.ufield.split("|");const [,u]=upFind(id);if(u)u.ai.fields[k]=t.value}});
document.addEventListener("click",async ev=>{const b=ev.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-rmkey")){try{localStorage.removeItem("loanapp.apikey")}catch(e){}AI.sample=null;AI.imgOK=false;render();return}
  if(b.hasAttribute("data-toggle-done")){const c=curCase();AI.showDone[c.id]=!AI.showDone[c.id];render();return}
  const id=b.dataset.uconfirm||b.dataset.usave||b.dataset.uignore;if(!id)return;
  const [c,u]=upFind(id);if(!u)return;
  if(b.dataset.uconfirm){const it=c.items[u.match];if(!it)return;it.done=true;it.at=new Date().toISOString();it.files=(it.files||[]).concat(u.assetId?[u.assetId]:[]);u.status="confirmed";if(c.status==="new")c.status="collect";
    await saveCase(c,`确认 AI 文件：${u.name} → 已收「${it.zh}」`);toast(L("文件已确认并打勾"));}
  else if(b.dataset.usave){u.status="confirmed";u.match=-1;await saveCase(c,`保存 AI 资料：${u.name}`);toast(L("资料已保存"))}
  else{u.status="ignored";await saveCase(c,`忽略 AI 文件：${u.name}`)}
});
boot().then(aiInit);
</script>

</body>
</html>
